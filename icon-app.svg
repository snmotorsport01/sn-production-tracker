<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="52%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#040404"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".28"/>
    </linearGradient>
    <!-- carbon-fibre twill weave (woven tiles + diagonal sheen) -->
    <pattern id="carbon" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#0e0e0e"/>
      <g fill="#191919"><rect x="0" y="0" width="11" height="11" rx="2.5"/><rect x="12" y="12" width="11" height="11" rx="2.5"/></g>
      <g fill="#070707"><rect x="12" y="0" width="11" height="11" rx="2.5"/><rect x="0" y="12" width="11" height="11" rx="2.5"/></g>
      <path d="M-3,3 l8,-8 M9,15 l8,-8 M21,27 l8,-8" stroke="#ffffff" stroke-opacity=".055" stroke-width="1.6"/>
      <path d="M15,-3 l-8,8 M27,9 l-8,8 M3,21 l-8,8" stroke="#ffffff" stroke-opacity=".055" stroke-width="1.6"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="b"/>
      <feFlood flood-color="#ffffff" flood-opacity=".48"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#carbon)"/>
  <rect width="1000" height="1000" fill="url(#sweep)"/>

  <!-- SN monogram, scaled to ~58% and centred so the carbon shows around it -->
  <g transform="translate(210,210) scale(0.58)" filter="url(#glow)">
    <path fill="#ffffff" d="M900,100.1h0c0,0-599.3,0-599.3,0,0,0,0,0,0,0s0,0,0,0c-12.8,0-25.2,1.3-37.4,3.7-48,8.7-91.4,32.9-122.7,69.3-30,34.8-45.8,76.9-45.8,121.6v600.9h5.1v1.5h600.7c31.2,0,60.6-7.5,87-20.8,26.3-12.4,49.8-30,68.8-52.1,30-34.8,45.8-76.9,45.8-121.6V100.1h-2.4ZM513,702.6l-.8-129.5v-51.4h61.4l127.2.8c85.9,0,155.7,73.4,155.7,163.6s-69.9,163.6-155.7,163.6l-95.1.6c-55.3-29-92.7-84.3-92.7-147.7ZM296.7,147.3l94.8-.6c55.3,29,92.8,84.3,92.8,147.8l.4,180.3-183.9-.4c-85.9,0-155.7-73.4-155.7-163.6s67.7-161.3,151.7-163.5ZM826.4,521.7c-34.4-29.1-78.1-46.5-125.7-46.5l-188.6-.4v-181.4c-.2-44.3-16.1-86-45.8-120.6-8.4-9.7-17.6-18.5-27.5-26.4h436.5v435.4c-12.6-23.1-29.2-43.5-48.9-60.1ZM121.9,850.5v-443.5c13.1,26.5,31.2,49.8,53.1,68.3,34.2,28.9,77.5,46.2,124.7,46.5.3,0,.7,0,1,0s.7,0,1,0h182.9l.4,180.8c0,44.7,15.8,86.7,45.8,121.6,8.3,9.7,17.5,18.5,27.5,26.4H121.9Z"/>
  </g>
</svg>
