<!DOCTYPE html>
<html lang="th">
<head>
<!--sn-me-->
<script>(function(){try{var page=(location.pathname.split('/').pop()||'index.html');if(page==='login.html')return;var API='https://script.google.com/macros/s/AKfycbzMqTc5rY4oi2jelEuuMZhybmbx-_13zaG0zDDrjvjC09Bx3sloUEa4c1V8Cv3fTtZW/exec';var tok=sessionStorage.getItem('sn_token')||localStorage.getItem('sn_token');var raw=sessionStorage.getItem('sn_user')||localStorage.getItem('sn_user');if(!tok||!raw)return;var u;try{u=JSON.parse(raw);}catch(e){return;}try{var _mt=+(sessionStorage.getItem('sn_me_ts')||0);if(Date.now()-_mt<300000)return;sessionStorage.setItem('sn_me_ts',String(Date.now()));}catch(e){}var keep=!!localStorage.getItem('sn_token');fetch(API+'?api=authMe&token='+encodeURIComponent(tok)).then(function(r){return r.json()}).then(function(d){if(!d)return;if(d.success===false&&(d.code===401||d.code===403)){sessionStorage.clear();try{localStorage.removeItem('sn_token');localStorage.removeItem('sn_user');localStorage.removeItem('sn_perms');}catch(e){}location.replace('login.html');return;}if(d.success&&d.user&&d.user.role&&d.user.role!==u.role){sessionStorage.setItem('sn_user',JSON.stringify(d.user));if(keep)localStorage.setItem('sn_user',JSON.stringify(d.user));fetch(API+'?api=getPermissions').then(function(r){return r.json()}).then(function(pr){if(pr&&pr.permissions){var pj=JSON.stringify(pr.permissions);sessionStorage.setItem('sn_perms',pj);if(keep)localStorage.setItem('sn_perms',pj);}}).catch(function(){}).then(function(){location.reload();});}}).catch(function(){});}catch(e){}})();</script>

<!--sn-perm-->
<script>(function(){try{var page=(location.pathname.split('/').pop()||'index.html');if(page==='login.html'||page==='index.html'||page==='hub.html')return;var raw=sessionStorage.getItem('sn_user')||localStorage.getItem('sn_user');if(!raw)return;var u=JSON.parse(raw);if(!u||u.role==='admin')return;var P=null;try{P=JSON.parse(sessionStorage.getItem('sn_perms')||localStorage.getItem('sn_perms')||'null');}catch(e){}if(P&&P[u.role]){if(P[u.role].indexOf(page)===-1){location.replace('index.html');return;}var allow=P[u.role];document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('.bottom-nav a,.bnav a').forEach(function(a){var h=(a.getAttribute('href')||'').split('/').pop();if(h&&/\.html$/.test(h)&&h!=='index.html'&&h!=='hub.html'&&allow.indexOf(h)===-1)a.style.display='none';});});}}catch(e){}})();</script>

<title>SN ERP — เข้าสู่ระบบ</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08090b;color:#ecebe5;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
.login-container{width:100%;max-width:392px;padding:24px}
.brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:24px}
.brand .wm{font-family:'Chakra Petch',sans-serif;font-weight:700;letter-spacing:.2em;font-size:1.55rem;color:#fff}
.brand .sub{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.32em;color:#63656d;text-transform:uppercase}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:#8d8b83;text-align:center;margin-bottom:18px}
.tab-bar{display:flex;margin-bottom:22px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);overflow:hidden}
.tab-bar button{flex:1;padding:11px;background:transparent;border:none;color:#8d8b83;font-family:'Chakra Petch',sans-serif;font-size:.92rem;font-weight:600;cursor:pointer;transition:.2s}
.tab-bar button.active{background:#cea24a;color:#141005}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:#8d8b83;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
.form-group input,.form-group select{width:100%;padding:13px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:11px;color:#ecebe5;font-size:1rem;outline:none;transition:.2s;font-family:'IBM Plex Sans Thai',sans-serif}
.form-group input:focus,.form-group select:focus{border-color:#cea24a;box-shadow:0 0 0 2px rgba(206,162,74,.16)}
.pin-input-row{display:flex;gap:9px;justify-content:center}
.pin-input-row input{flex:1;max-width:66px;aspect-ratio:1;text-align:center;font-size:1.4rem;font-weight:700;font-family:'Chakra Petch',sans-serif;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#e4c77a;outline:none;transition:.2s}
.pin-input-row input:focus{border-color:#cea24a;box-shadow:0 0 0 2px rgba(206,162,74,.16)}
.btn-primary{width:100%;padding:15px;background:linear-gradient(180deg,#e4c77a,#cea24a);border:none;border-radius:12px;color:#141005;font-family:'Chakra Petch',sans-serif;font-size:1.02rem;font-weight:700;cursor:pointer;margin-top:6px;transition:.2s}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}
.error-msg{background:rgba(229,85,90,.14);border:1px solid rgba(229,85,90,.32);color:#e5686d;padding:12px 14px;border-radius:10px;font-size:.85rem;margin-bottom:14px;display:none}
.success-msg{background:rgba(104,176,155,.14);border:1px solid rgba(104,176,155,.32);color:#68b09b;padding:12px 14px;border-radius:10px;font-size:.85rem;margin-bottom:14px;display:none}
.remember{display:flex;align-items:center;gap:8px;margin:10px 0 14px;font-size:.85rem;color:#a7a59d;cursor:pointer}
.remember input{accent-color:#cea24a;width:16px;height:16px}
.info-text{text-align:center;color:#63656d;font-size:.78rem;margin-top:16px}
.online{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.06em;color:#68b09b;margin-top:16px}
.version-tag{position:fixed;bottom:12px;right:16px;color:#3a3c42;font-size:.66rem;font-family:'IBM Plex Mono',monospace}
.loading-spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(20,16,5,.35);border-top-color:#141005;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<!--sn-perf-->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<script>if('serviceWorker'in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>

</head>
<body>
<div class="login-container">
  <div class="brand">
    <svg width="52" height="52" viewBox="0 0 40 40" fill="none" aria-label="SN"><rect x="1.5" y="1.5" width="37" height="37" rx="10" stroke="#cea24a" stroke-width="1.6"/><path d="M13 25c0-3 3-3 6-4.5S25 16 25 13m-12 1c0 3 3 3 6 4.5S25 24 25 27" stroke="#e4c77a" stroke-width="2.4" stroke-linecap="round"/></svg>
    <div class="wm">SN&nbsp;ERP</div>
    <div class="sub">Production &amp; Operations</div>
  </div>
  <div class="eyebrow">· Secure Access ·</div>
  <div class="tab-bar">
    <button class="active" onclick="showTab('login')">เข้าสู่ระบบ</button>
    <button onclick="showTab('register')">ลงทะเบียน</button>
  </div>
  <div id="errorMsg" class="error-msg"></div>
  <div id="successMsg" class="success-msg"></div>
  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="form-group">
      <label>ชื่อผู้ใช้</label>
      <input type="text" id="loginUser" placeholder="username" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>PIN (4 หลัก)</label>
      <div class="pin-input-row">
        <input type="password" maxlength="1" inputmode="numeric" class="pin-digit" data-idx="0" autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" class="pin-digit" data-idx="1" autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" class="pin-digit" data-idx="2" autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" class="pin-digit" data-idx="3" autocomplete="off">
      </div>
      <input type="hidden" id="loginPin">
    </div>
    <label class="remember"><input type="checkbox" id="keepLogin">จดจำการเข้าสู่ระบบ</label><button type="submit" class="btn-primary" id="loginBtn">เข้าสู่ระบบ</button>
    <div class="online">● SYSTEM ONLINE</div>
  </form>
  <form id="registerForm" style="display:none" onsubmit="doRegister(event)">
    <div class="form-group">
      <label>ชื่อผู้ใช้</label>
      <input type="text" id="regUser" placeholder="username (ภาษาอังกฤษ)" required>
    </div>
    <div class="form-group">
      <label>ชื่อแสดง</label>
      <input type="text" id="regName" placeholder="ชื่อ-นามสกุล" required>
    </div>
    <div class="form-group">
      <label>PIN (4 หลัก)</label>
      <div class="pin-input-row">
        <input type="password" maxlength="1" inputmode="numeric" class="reg-pin-digit" data-idx="0" autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" class="reg-pin-digit" data-idx="1" autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" class="reg-pin-digit" data-idx="2" autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" class="reg-pin-digit" data-idx="3" autocomplete="off">
      </div>
      <input type="hidden" id="regPin">
    </div>
    <div class="form-group">
      <label>ยืนยัน PIN</label>
      <div class="pin-input-row">
        <input type="password" maxlength="1" inputmode="numeric" class="reg-pin2-digit" data-idx="0" autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" class="reg-pin2-digit" data-idx="1" autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" class="reg-pin2-digit" data-idx="2" autocomplete="off">
        <input type="password" maxlength="1" inputmode="numeric" class="reg-pin2-digit" data-idx="3" autocomplete="off">
      </div>
      <input type="hidden" id="regPin2">
    </div>
    <p class="info-text" style="margin-bottom:12px">ลงทะเบียนเป็น Operator (ผู้ปฏิบัติงาน)</p>
    <button type="submit" class="btn-primary" id="regBtn">ลงทะเบียน</button>
  </form>
  <p class="info-text" id="footerInfo">ใช้ PIN 4 หลักในการเข้าสู่ระบบ</p>
</div>
<div class="version-tag">SN ERP v3.0 · COMMAND DECK</div>
<script>
var API='https://script.google.com/macros/s/AKfycbzMqTc5rY4oi2jelEuuMZhybmbx-_13zaG0zDDrjvjC09Bx3sloUEa4c1V8Cv3fTtZW/exec';
(function(){var t=sessionStorage.getItem('sn_token');if(t)window.location.href='index.html'})();
function showTab(tab){var b=document.querySelectorAll('.tab-bar button');b[0].className=tab==='login'?'active':'';b[1].className=tab==='register'?'active':'';document.getElementById('loginForm').style.display=tab==='login'?'block':'none';document.getElementById('registerForm').style.display=tab==='register'?'block':'none';hideMessages()}
function hideMessages(){document.getElementById('errorMsg').style.display='none';document.getElementById('successMsg').style.display='none'}
function showError(m){var e=document.getElementById('errorMsg');e.textContent=m;e.style.display='block';document.getElementById('successMsg').style.display='none'}
function showSuccess(m){var e=document.getElementById('successMsg');e.textContent=m;e.style.display='block';document.getElementById('errorMsg').style.display='none'}
function setupPinInputs(sel,hid){var d=document.querySelectorAll(sel);d.forEach(function(inp,i){inp.addEventListener('input',function(){if(this.value.length===1&&i<3)d[i+1].focus();collectPin(sel,hid)});inp.addEventListener('keydown',function(e){if(e.key==='Backspace'&&this.value===''&&i>0){d[i-1].focus();d[i-1].value='';collectPin(sel,hid)}});inp.addEventListener('paste',function(e){e.preventDefault();var p=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').substring(0,4);for(var j=0;j<p.length&&j<4;j++)d[j].value=p[j];if(p.length>0)d[Math.min(p.length,3)].focus();collectPin(sel,hid)})})}
function collectPin(sel,hid){var d=document.querySelectorAll(sel);var p='';d.forEach(function(x){p+=x.value});document.getElementById(hid).value=p}
setupPinInputs('.pin-digit','loginPin');setupPinInputs('.reg-pin-digit','regPin');setupPinInputs('.reg-pin2-digit','regPin2');
function doLogin(e){e.preventDefault();hideMessages();var u=document.getElementById('loginUser').value.trim();var p=document.getElementById('loginPin').value;if(!u){showError('กรุณาระบุชื่อผู้ใช้');return}if(p.length!==4){showError('กรุณาระบุ PIN 4 หลัก');return}var btn=document.getElementById('loginBtn');btn.disabled=true;btn.innerHTML='<span class="loading-spinner"></span>กำลังเข้าสู่ระบบ...';fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'auth_login',username:u,pin:p})}).then(function(r){return r.json()}).then(function(d){if(d.success){var keep=document.getElementById('keepLogin').checked;sessionStorage.setItem('sn_token',d.token);sessionStorage.setItem('sn_user',JSON.stringify(d.user));if(keep){localStorage.setItem('sn_token',d.token);localStorage.setItem('sn_user',JSON.stringify(d.user));}try{sessionStorage.setItem('sn_me_ts',String(Date.now()));}catch(e){}var _done=false,_go=function(){if(_done)return;_done=true;window.location.href='index.html'},_tm=setTimeout(_go,2500);fetch(API+'?api=getPermissions').then(function(r){return r.json()}).then(function(pr){if(pr&&pr.permissions){var pj=JSON.stringify(pr.permissions);sessionStorage.setItem('sn_perms',pj);if(keep)localStorage.setItem('sn_perms',pj);}}).catch(function(){}).then(function(){clearTimeout(_tm);_go()})}else{showError(d.error||'เข้าสู่ระบบไม่สำเร็จ');btn.disabled=false;btn.textContent='เข้าสู่ระบบ'}}).catch(function(err){if(!window._snLoginRetried){window._snLoginRetried=true;setTimeout(function(){doLogin(e)},500);return;}showError('เชื่อมต่อเซิร์ฟเวอร์ช้า/ไม่ได้ ลองกดใหม่');btn.disabled=false;btn.textContent='เข้าสู่ระบบ'})}
function doRegister(e){e.preventDefault();hideMessages();var u=document.getElementById('regUser').value.trim();var n=document.getElementById('regName').value.trim();var p=document.getElementById('regPin').value;var p2=document.getElementById('regPin2').value;if(!u){showError('กรุณาระบุชื่อผู้ใช้');return}if(!/^[a-zA-Z0-9_]+$/.test(u)){showError('ชื่อผู้ใช้ต้องเป็นภาษาอังกฤษเท่านั้น');return}if(!n){showError('กรุณาระบุชื่อแสดง');return}if(p.length!==4){showError('กรุณาระบุ PIN 4 หลัก');return}if(p!==p2){showError('PIN ไม่ตรงกัน');return}var btn=document.getElementById('regBtn');btn.disabled=true;btn.innerHTML='<span class="loading-spinner"></span>กำลังลงทะเบียน...';fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'auth_register',username:u,name:n,pin:p,role:'operator'})}).then(function(r){return r.json()}).then(function(d){if(d.success){showSuccess('ลงทะเบียนสำเร็จ! กรุณาเข้าสู่ระบบ');btn.disabled=false;btn.textContent='ลงทะเบียน';setTimeout(function(){showTab('login')},1500)}else{showError(d.error||'ลงทะเบียนไม่สำเร็จ');btn.disabled=false;btn.textContent='ลงทะเบียน'}}).catch(function(err){showError('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้: '+err.message);btn.disabled=false;btn.textContent='ลงทะเบียน'})}
</script>

<script>
// Keep Login auto-check
(function(){var t=localStorage.getItem('sn_token');var u=localStorage.getItem('sn_user');if(t&&u){sessionStorage.setItem('sn_token',t);sessionStorage.setItem('sn_user',u);window.location.href='index.html';return;}})();
window.addEventListener('DOMContentLoaded',function(){var p=document.querySelector('.logo-wrap p');var img=document.querySelector('.logo-wrap img');if(p&&img){img.style.width=p.offsetWidth+'px';}window.addEventListener('resize',function(){if(p&&img)img.style.width=p.offsetWidth+'px';});});</script>
</body>
</html>
